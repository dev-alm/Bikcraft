<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Loja</title>
    <link rel="stylesheet" href="testefacul.css">
</head>
<body>
    <!-- Cabeçalho -->
    <header>
        <div class="logo">
            <h1>DWF Multistore</h1>
        </div>
        <div class="search-bar">
            <input type="text" placeholder="Buscar...">
            <button>Buscar</button>
        </div>
        <nav>
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">Produtos</a></li>
                <li><a href="#">Promoções</a></li>
                <li><a href="#">Contato</a></li>
            </ul>
        </nav>
    </header>

    <!-- Banner -->
    <section class="banner">
        <img src="banner.png" id= "banner" alt="Promoção Especial">
    </section>

    <!-- Produtos -->
    <section class="produtos">
        <h2>Destaques</h2>
        <div class="produtos-grid">
            <div class="produto-item">
                <img src="mcqueen.png" alt="Produto 1">
                <h3>Mcqueen carros</h3>
                <p>R$ 99,90</p>
                <button>Comprar</button>
            </div>
            <div class="produto-item">
                <img src="boneca.png" alt="Produto 2">
                <h3>Boneca</h3>
                <p>R$ 79,90</p>
                <button>Comprar</button>
            </div>
            <div class="produto-item">
                <img src="arma2.png" alt="Produto 3">
                <h3>Pistola nerf</h3>
                <p>R$ 69,90</p>
                <button>Comprar</button>
            </div>
            <div class="produto-item">
                <img src="celular.png" alt="Produto 4">
                <h3>Buba celular</h3>
                <p>R$ 24,90</p>
                <button>Comprar</button>
            </div>
            <div class="produto-item">
                <img src="deadpool.png" alt="Produto 5">
                <h3>Deadpool boneco</h3>
                <p>R$ 59,90</p>
                <button onclick="window.location.href='produto-item'">Comprar</button>
            </div>
            <div class="produto-item">
                <img src="uno.png" alt="Produto 6">
                <h3>Uno speed</h3>
                <p>R$ 39,90</p>
                <button>Comprar</button>
            </div>
            <script>
                // Simulação de produtos no carrinho
                const urlParams = new URLSearchParams(window.location.search);
                const produtoNome = urlParams.get('produto');
        
                const carrinhoContainer = document.getElementById('carrinho-container');
        
                if (produtoNome) {
                    carrinhoContainer.innerHTML = `
                        <div class="carrinho-item">
                            <h2>Produto Adicionado: ${produtoNome}</h2>
                            <p>Este produto foi adicionado ao seu carrinho.</p>
                        </div>
                    `;
                } else {
                    carrinhoContainer.innerHTML = <p>Nenhum produto foi adicionado ao carrinho.</p>;
                }
            </script>
        </div>
    </section>

    <!-- Rodapé -->
    <footer>
        <p>&copy; 2024 Minha Loja - Todos os direitos reservados.</p>
    </footer>
</body>
</html>
